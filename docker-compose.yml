# Mis Pesitos self-hosted: Postgres + preparación de la base + app.
#
#   cp .env.selfhost.example .env     # y completalo
#   docker compose up -d --build
#
# Ver la sección "Instalación propia" del README.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mispesitos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mispesitos"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Corre en cada `up`, es idempotente y termina: crea los roles que faltan,
  # aplica migraciones nuevas y fija la contraseña de app_user.
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/mispesitos
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Falta APP_USER_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      # La app conecta como app_user (sin BYPASSRLS), nunca como postgres.
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD}@db:5432/mispesitos
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Falta BETTER_AUTH_SECRET en .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Falta BETTER_AUTH_URL en .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:

# Mis Pesitos self-hosted: Postgres + preparación de la base + app.
#
# Instalación rápida (sin crear .env):
#   docker compose up -d
#   Abrí http://localhost:3000 y creá la cuenta de administrador.
#
# Si lo publicás con un dominio propio, creá un `.env` (ver .env.example)
# al menos con BETTER_AUTH_URL=https://pesitos.tudominio.com

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mispesitos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mispesitos_postgres_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mispesitos"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Corre en cada `up`, es idempotente y termina: crea los roles que faltan,
  # aplica migraciones nuevas y fija la contraseña de app_user.
  migrate:
    image: ghcr.io/fdreer/mispesitos:latest
    command: ["node", "scripts/db-setup.mjs"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-mispesitos_postgres_local_only}@db:5432/mispesitos
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-mispesitos_app_user_local_only}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/fdreer/mispesitos:latest
    restart: unless-stopped
    environment:
      # La app conecta como app_user (sin BYPASSRLS), nunca como postgres.
      DATABASE_URL: postgresql://app_user:${APP_USER_PASSWORD:-mispesitos_app_user_local_only}@db:5432/mispesitos
      # Si BETTER_AUTH_SECRET queda vacía, se genera automáticamente en /app/data/auth-secret.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    volumes:
      - appdata:/app/data
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  appdata:
